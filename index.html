<style>
body{margin:0;font-family:Arial;background:#cac7a5}

/* HEADER */
header{
position:fixed;top:0;width:100%;height:65px;z-index:100;
background:#2209c2;padding:0 15px;
display:flex;align-items:center;justify-content:space-between;
}
header img{height:45px;border-radius:50%;border: 3px solid #f7f3f3}
.brand-name{color:#ffdd01;font-size:20px;font-weight:900;letter-spacing: 2px;/* --- NEW TEXT SHADOW --- */ text-shadow: 2px 2px 4px rgba(0,0,0,0.5);}
#userTop{color:#edf57f;font-weight:bold;cursor:pointer;margin-right:25px}

/* MAIN */
.main{padding-top:70px;padding-bottom:120px}

/* SEARCH */
.search-wrapper{padding:10px}
.search-input {
    width: 90%; padding: 12px; border: none; border-radius: 30px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2); outline: none;
}

/* AFFILIATE PARTNERS SECTION */
.partner-section {
    margin-top: 30px;
    padding: 15px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 15px;
}
.partner-section h4 {
    margin-bottom: 15px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #edf57f;
}
.partner-logos {
    display: flex;
    justify-content: space-around;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}
.partner-logos img {
    height: 30px; /* Logo ka size yahan se control karein */
    filter: brightness(1.1);
    background: #fff;
    padding: 5px;
    border-radius: 5px;
}

/* VALENTINE FLIPKART STYLE SECTION */
.v-container {
    background: #fff; margin: 10px; border-radius: 10px; overflow: hidden;
    border: 2px solid #eb1115;
}
.v-header {
    background: #ff416c; color: #fff; padding: 8px; text-align: center;
    font-weight: bold; font-size: 14px;
}
.v-scroll {
    display: flex; overflow-x: auto; padding: 10px; gap: 15px;
}
.v-item {
    min-width: 100px; text-align: center;
}
.v-item img {
    width: 80px; height: 80px; border-radius: 10px; object-fit: cover;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
.v-item p { margin: 5px 0; font-size: 12px; font-weight: bold; color: #d32f2f; }

/* CATEGORY */
.cat-scroll{display:flex;overflow-x:auto;background:#ffd902;padding:10px;margin:0 10px;border-radius:10px}
.cat-item{color:rgb(254, 254, 253);;text-align:center;margin-right:10px; font-weight: bold; cursor: pointer;
/* --- NEW BORDER STYLE --- */
border: 1px solid #000; /* Black border */
padding: 3px 5px;border-radius:3px;background: #ff416c;display:inline-block;
}

.sub-scroll{display:flex;overflow-x:auto;padding:10px;margin:0 10px}
.sub-btn{color:rgb(254, 254, 253);padding:3px 5px;background:#ff0202;border-radius:4px;margin-right:8px; cursor: pointer; border:1px solid #000;}

/* PRODUCTS */
#grid_panel{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px; }
.prod-card{ background:#fff; border-radius:10px; overflow:hidden; position:relative; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
.prod-img-box{ height:180px; position:relative; }

/* SLIDER */
.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory; scrollbar-width: none;}
.slider::-webkit-scrollbar {display: none;}
.slider img{min-width:100%;height:180px;object-fit:cover;scroll-snap-align:start;cursor:pointer}

/* ARROWS - EXACTLY LIKE YOUR ORIGINAL */
.arrow{
position:absolute;top:50%;
transform:translateY(-50%);
background:rgba(0,0,0,0.5);
color:#fff;width:30px;height:30px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
font-size:18px;cursor:pointer;z-index:5;user-select:none;
}
.arrow.left{left:5px}
.arrow.right{right:5px}

.info-box{padding:15px}
.price{color:green;font-weight:bold}
.cut{text-decoration:line-through;color:#f40e0e;font-size:12px}
.btn-row{display:flex;gap:5px}
.btn-row button{ flex:1; border:none; padding:8px; background:#e2de04;font-size:15px;font-weight:900;color:#fff; border-radius:5px; cursor: pointer;/* --- NEW TEXT SHADOW --- */ text-shadow: 2px 2px 4px rgba(0,0,0,0.5);} 

/* NAV */
.bottom-nav{ position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; padding: 5px 0; background: #c5a3a3; z-index: 100;}
.bottom-nav div { flex: 1; text-align: center; padding: 10px 0; margin: 5px;font-weight:600; border-radius: 15px; cursor: pointer; border: 2px solid transparent;font-weight: 900;}
.bottom-nav div:nth-child(1) { border-color: #FF671F; }
.bottom-nav div:nth-child(2) { border-color: #f903b7f2; }
.bottom-nav div:nth-child(3) { border-color: #046A38; }


/* PAGES */
#loginPage, #accountPage{display:none;padding:80px 20px;text-align:center;background:#0d0dde;color:#fff; min-height: 100vh;}
#loginPage input{width:80%;padding:12px;margin:10px 0;border-radius:8px;border:none}
#loginPage button{width:85%;padding:12px;background:#2209c2;color:#fff;border:none;border-radius:8px}

#imgViewer{ position:fixed;inset:0;background:#000;display:none;z-index:200; }
</style>

let activeCat="For You", activeSub="", searchTerm="";
let wishlist=JSON.parse(localStorage.getItem("wishlist")||"[]");

/* RENDER FUNCTIONS */
function drawCategories(){
    cat_panel.innerHTML="";
    DB_CATS.forEach(c=>{cat_panel.innerHTML+=`<div class="cat-item" onclick="changeCat('${c.name}')">${c.name}</div>`;});
}
function drawSubcats(){
    sub_panel.innerHTML="";
    let f=DB_CATS.find(x=>x.name===activeCat);
    if(f&&f.sub){f.sub.forEach(s=>{sub_panel.innerHTML+=`<div class="sub-btn" onclick="changeSub('${s}')">${s}</div>`;});}
}


    function drawProducts(list = DB_ITEMS) {
    grid_panel.innerHTML = "";
    let priceLimit = document.getElementById("priceFilter").value;

    // --- NEW: Category and Sub-category Filter ---
    let filteredList = list.filter(p => {
        // अगर 'For You' है तो सब दिखाओ, नहीं तो कैटेगरी मैच करो
        let catMatch = (activeCat === "For You") || (p.cat === activeCat);
        // अगर सब-कैटेगरी सिलेक्टेड है, तो उसे भी चेक करो
        let subMatch = (activeSub === "") || (p.sub === activeSub);
        // सर्च टर्म भी चेक करो
        let searchMatch = p.name.toLowerCase().includes(searchTerm);
        
        return catMatch && subMatch && searchMatch;
    });

    // 1. प्राइस रेंज के हिसाब से मैचिंग प्रोडक्ट्स को अलग करें
    let matchingItems = filteredList.filter(p => {
        if (priceLimit === "all") return true;
        let price = parseFloat(p.price);
        if (priceLimit === "10-200") return price >= 10 && price <= 200;
        if (priceLimit === "200-500") return price > 200 && price <= 500;
        if (priceLimit === "500-1000") return price > 500 && price <= 1000;
        if (priceLimit === "1000-2000") return price > 1000 && price <= 2000;
        if (priceLimit === "2000-5000") return price > 2000 && price <= 5000;
        if (priceLimit === "5000-30000") return price > 5000 && price <= 30000;
        return true;
    });

    // 2. बाकी प्रोडक्ट्स (जो सिर्फ कैटेगरी में हैं पर प्राइस रेंज में नहीं)
    let nonMatchingItems = filteredList.filter(p => !matchingItems.includes(p));

    // 3. दोनों को जोड़ें
    let fullList = [...matchingItems, ...nonMatchingItems];

    // 4. Pagination (एक बार में 30 दिखाओ)
    const start = (currentPage - 1) * itemsPerPage;
    const end = start + itemsPerPage;
    const paginatedItems = fullList.slice(start, end);

    // खाली लिस्ट चेक करें
    if (paginatedItems.length === 0) {
        grid_panel.innerHTML = "<p style='text-align:center; grid-column:1/-1;'>No products found in this category.</p>";
        return;
    }

    paginatedItems.forEach(p => {
        let discount = Math.round(((p.cut - p.price) / p.cut) * 100);
        let isMatch = matchingItems.includes(p) && priceLimit !== "all";

        grid_panel.innerHTML += `
        <div class="prod-card" style="${isMatch ? 'border: 2px solid #2209c2;' : ''}">
            ${isMatch ? '<span style="position:absolute; top:5px; left:5px; background:green; color:white; padding:2px 7px; border-radius:10px; font-size:10px; z-index:10;">MATCH</span>' : ''}
            <div class="prod-img-box">
                <div class="slider" id="slider_${p.id}">
                    ${p.imgs.map(img => `<img src="${img}" onclick='openViewer(${JSON.stringify(p.imgs)})'>`).join("")}
                </div>
                <div class="arrow left" onclick="slideImg(${p.id},-1)">‹</div>
                <div class="arrow right" onclick="slideImg(${p.id},1)">›</div>
            </div>
            <div class="info-box">
                <b>${p.name}</b><br>
                <span class="price">₹${p.price}</span> <span class="cut">₹${p.cut}</span>
                <span style="color:green; font-weight:bold; font-size:12px;"> ${discount}% OFF</span>
                <div class="btn-row">
                    <button onclick="addWishlist(${p.id})">🛒</button>
                    <button onclick="window.open('${p.link}')">BUY</button>
                </div>
            </div>
        </div>`;
    });

    renderPaginationButtons(fullList.length);
}                             

function renderPaginationButtons(totalItems) {
    const totalPages = Math.ceil(totalItems / itemsPerPage);
    
    // अगर पेज 1 से ज़्यादा हैं, तभी बटन दिखाओ
    if (totalPages <= 1) return; 

    // बटन दिखाने के लिए HTML जोड़ना
    grid_panel.innerHTML += `
        <div style="grid-column: 1 / -1; text-align: center; padding: 20px; display: flex; justify-content: center; gap: 10px;">
            <button onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''} 
                style="padding: 10px 20px; background: #2209c2; color: white; border: none; border-radius: 5px;">
                Back
            </button>
            <span style="font-weight: bold; line-height: 40px;">Page ${currentPage} of ${totalPages}</span>
            <button onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''} 
                style="padding: 10px 20px; background: #2209c2; color: white; border: none; border-radius: 5px;">
                Next
            </button>
        </div>`;
}

// पेज बदलने वाला फंक्शन
function changePage(step) {
    currentPage += step;
    window.scrollTo(0, 0); // ऊपर ले जाने के लिए
    drawProducts(); // लिस्ट रिफ्रेश करने के लिए
}
/* FIXING SLIDER ARROWS */
function slideImg(id,dir){
    let s=document.getElementById("slider_"+id);
    s.scrollBy({left:dir*s.clientWidth,behavior:"smooth"});
}

/* NAVIGATION & SEARCH */
function changeCat(c){activeCat=c;activeSub="";drawSubcats();drawProducts();}
function changeSub(s){activeSub=s;drawProducts();}
function runSearch(){searchTerm=searchInp.value.toLowerCase();drawProducts();}
function resetHome(){
    document.getElementById("accountPage").style.display="none";
    document.getElementById("loginPage").style.display="none";
    document.getElementById("mainSection").style.display="block";
    activeCat="For You"; drawProducts();
}

/* WISHLIST */
function addWishlist(id){if(!wishlist.includes(id)){wishlist.push(id);localStorage.setItem("wishlist",JSON.stringify(wishlist));alert("Saved to wishlist");}}
function showWishlist(){drawProducts(DB_ITEMS.filter(p=>wishlist.includes(p.id)));}

/* ACCOUNT & LOGIN FIX */
function openAccount(){
    let u = localStorage.getItem("customer_name");
    document.getElementById("mainSection").style.display="none";
    document.getElementById("loginPage").style.display="none";
    document.getElementById("accountPage").style.display="none";
    if(u){
        document.getElementById("accountPage").style.display="block";
        document.getElementById("accName").innerText="Welcome back, "+u;
    } else {
        document.getElementById("loginPage").style.display="block";
    }
}
function doLogin(){
    let name = document.getElementById("custName").value.trim();
    if(name===""){alert("Enter name");return;}
    localStorage.setItem("customer_name",name);
    document.getElementById("userTop").innerText=name;
    openAccount();
}
function logout(){localStorage.removeItem("customer_name");location.reload();}

/* VIEWER */
function openViewer(imgs){
    viewerSlider.innerHTML=imgs.map(i=>`<img src="${i}" style="width:100%;height:100vh;object-fit:contain;">`).join("");
    document.getElementById("imgViewer").style.display="block";
}
function closeViewer(){document.getElementById("imgViewer").style.display="none";}
